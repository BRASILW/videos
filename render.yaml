services:
  - type: web
    name: videos-lavalink
    runtime: image
    plan: free
    image:
      url: ghcr.io/lavalink-devs/lavalink:4-alpine
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: SERVER_PORT
        value: "10000"
      - key: LAVALINK_SERVER_PASSWORD
        sync: false
      - key: LAVALINK_SERVER_SOURCES_YOUTUBE
        value: "false"
      - key: LAVALINK_PLUGINS_0_DEPENDENCY
        value: dev.lavalink.youtube:youtube-plugin:1.18.2
      - key: PLUGINS_YOUTUBE_ENABLED
        value: "true"

databases:
  - name: videos-postgres
    databaseName: discord_bot
    user: discord_bot
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
